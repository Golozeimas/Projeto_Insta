<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadastro do insta </title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="container">
        <main>
            <img src="imgs/Programgram.png" alt="Logo do instagram">
            <p> Cadastre-se para ver fotos <br> e vídeos dos seus amigos </p>
            <button>Entrar com o facebook</button>
            <form>
                <input placeholder="Número do celular ou email" type="text ">
                <input placeholder="Nome completo" type="text">
                <input placeholder="Nome do usuário"  type="text">
                <input placeholder="Senha" type="password">
                <button>Entrar</button>
            </form>
        </main>
        <section>
            <span> Tem uma conta? <a href="index.html">Conecte-se </a> </span>
        </section>
        <div>
            <p class="texto_final"> Obtenha o aplicativo </p>
            <div class="imagens">
            <img src="/imgs/appstore.png" width="150px" alt="Foto da app store">
            <img src="/imgs/googleplay.png" width="150px" alt="Foto da play store">
            </div>
        </div>
    </div>
</body>
</html>
