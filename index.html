<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title> Instagram 2 </title>
</head>
<body>
    <main class="wrapper">
        <section class="container">
            <div class="column left">
            </div> 
            <div class="column right">
                <div class="login_painel">
                <div class="logo">
                    <img class="img_logo"src="imgs/Programgram.png" alt="Logo do Instagram">
                </div>
                <form class="form" action="">
                <input class="input_insta" placeholder="Telefone, nome de usuário ou email" type="text">
                <input class="input_insta" placeholder="Senha" type="password">
                <button class="botao_login" value="Entrar">Entrar</button>
                </form>
                </div> 
                
                <div class="infobox">
                    <p>Não possui uma conta?<a href="cadastro.html"> Cadastre-se</a></p>
                </div>
                
                <div class="apps">
                    <p>Obtenha o aplicativo</p>
                    <a href="https://play.google.com/store/apps/details?id=com.instagram.android&hl=pt_BR&pli=1" target="_blank">
                    <img src="/imgs/googleplay.png"  alt="">
                    </a>
                    <a href="https://apps.apple.com/br/app/instagram/id389801252" target="_blank">
                    <img src="/imgs/appstore.png"   alt="">
                    </a>
                </div>
            </div>
        </section>
         <div class="footer">
            <span>About us</span>
            <span>Support</span>
            <span>Blog</span>
            <span>Press</span>
            <span>Api</span>
            <span>Jobs</span>
            <span>Privacy</span>
            <span>Terms</span>
            <span>Directory</span>
            <span>Profiles</span>
            <span>Hashtags</span>
            <span>Language</span>
            <span>©2026 INSTAGRAM</span>
        </div>    
    </main>
</body>
</html>
